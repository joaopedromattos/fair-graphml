[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-graphml"
version = "0.1.0"
description = "A unified estimator interface for fairness in graph machine learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=1.13", "numpy>=1.23", "scipy>=1.9", "networkx>=2.8"]

[project.optional-dependencies]
pyg = ["torch-geometric>=2.3"]
sklearn = ["scikit-learn>=1.2"]
dev = ["torch-geometric>=2.3", "scikit-learn>=1.2", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fair_graphml = ["py.typed"]
